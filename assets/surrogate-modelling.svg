<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="t d"><title id="t">Surrogate modelling</title><desc id="d">Sơ đồ mô hình vật lý độ trung thực cao tạo dữ liệu huấn luyện cho surrogate model để dự báo nhanh.</desc><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12344d"/><stop offset="1" stop-color="#247ba0"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a9d8f"/><stop offset="1" stop-color="#67c6d4"/></linearGradient></defs><rect width="980" height="620" rx="32" fill="#f7fbfc"/><g font-family="Inter,Arial,sans-serif"><text x="58" y="68" font-size="22" font-weight="700" fill="#12344d">SURROGATE MODELLING</text><text x="58" y="100" font-size="16" fill="#60717d">Khi mô hình vật lý rất tốt nhưng quá chậm cho hàng nghìn kịch bản.</text><g><rect x="65" y="190" width="210" height="170" rx="24" fill="#fff" stroke="#d8e3e9" stroke-width="2"/><text x="95" y="230" font-size="16" font-weight="700" fill="#12344d">Đầu vào</text><text x="95" y="265" font-size="15" fill="#60717d">Rainfall</text><text x="95" y="292" font-size="15" fill="#60717d">River level</text><text x="95" y="319" font-size="15" fill="#60717d">Gate operation</text><text x="95" y="346" font-size="15" fill="#60717d">Terrain / parameters</text></g><rect x="360" y="170" width="245" height="210" rx="28" fill="url(#g1)"/><text x="482" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">High-fidelity</text><text x="482" y="253" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Physics Model</text><text x="482" y="295" text-anchor="middle" font-size="15" fill="#d8ebf4">2D hydraulics · RRI · CFD</text><text x="482" y="325" text-anchor="middle" font-size="15" fill="#d8ebf4">minutes → hours / run</text><rect x="700" y="170" width="215" height="210" rx="28" fill="url(#g2)"/><text x="807" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Surrogate</text><text x="807" y="253" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Model</text><text x="807" y="295" text-anchor="middle" font-size="15" fill="#eefcf9">ML · DL · ROM</text><text x="807" y="325" text-anchor="middle" font-size="15" fill="#eefcf9">milliseconds → seconds</text><path d="M275 275h85" stroke="#8fb5c4" stroke-width="5" stroke-linecap="round"/><path d="M598 275h96" stroke="#8fb5c4" stroke-width="5" stroke-linecap="round"/><path d="M348 265l18 10-18 10z" fill="#8fb5c4"/><path d="M682 265l18 10-18 10z" fill="#8fb5c4"/><text x="650" y="245" text-anchor="middle" font-size="13" fill="#60717d">training data</text><rect x="155" y="455" width="670" height="92" rx="24" fill="#fff" stroke="#d8e3e9" stroke-width="2"/><text x="490" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#12344d">Dùng khi tốc độ thực sự tạo ra giá trị</text><text x="490" y="523" text-anchor="middle" font-size="15" fill="#60717d">Real-time forecasting · optimization · scenario analysis · uncertainty propagation</text><text x="490" y="588" text-anchor="middle" font-size="14" fill="#60717d">Surrogate không thay thế vật lý — nó xấp xỉ một mô hình đắt đỏ trong miền đã được học và kiểm chứng.</text></g></svg>