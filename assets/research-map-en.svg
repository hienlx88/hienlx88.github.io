<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Research map</title><desc id="d">A research map connecting rainfall observations, hydrology, hydraulics and decision support through AI, remote sensing, uncertainty and hybrid modelling.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f9fb"/><stop offset="1" stop-color="#eef8f5"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12344d" flood-opacity=".10"/></filter></defs><rect width="1200" height="650" rx="34" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="78" font-size="22" font-weight="700" fill="#12344d">RESEARCH MAP</text><text x="70" y="112" font-size="16" fill="#60717d">From observations → models → uncertainty → decision support</text><g filter="url(#s)"><rect x="80" y="190" width="220" height="140" rx="24" fill="#fff"/><rect x="350" y="190" width="220" height="140" rx="24" fill="#fff"/><rect x="620" y="190" width="220" height="140" rx="24" fill="#fff"/><rect x="890" y="190" width="220" height="140" rx="24" fill="#fff"/></g><circle cx="125" cy="235" r="22" fill="#67c6d4"/><circle cx="395" cy="235" r="22" fill="#2a9d8f"/><circle cx="665" cy="235" r="22" fill="#247ba0"/><circle cx="935" cy="235" r="22" fill="#c49a52"/><text x="115" y="243" font-size="24" fill="#fff">1</text><text x="385" y="243" font-size="24" fill="#fff">2</text><text x="655" y="243" font-size="24" fill="#fff">3</text><text x="925" y="243" font-size="24" fill="#fff">4</text><text x="115" y="285" font-size="20" font-weight="700" fill="#12344d">Rainfall & Observations</text><text x="115" y="313" font-size="15" fill="#60717d">Gauge · Radar · Satellite</text><text x="385" y="285" font-size="20" font-weight="700" fill="#12344d">Hydrology</text><text x="385" y="313" font-size="15" fill="#60717d">Runoff · Streamflow · Forecast</text><text x="655" y="285" font-size="20" font-weight="700" fill="#12344d">Hydraulics & Floods</text><text x="655" y="313" font-size="15" fill="#60717d">Water level · Extent · Depth</text><text x="925" y="285" font-size="20" font-weight="700" fill="#12344d">Decision Support</text><text x="925" y="313" font-size="15" fill="#60717d">Risk · Operation · Planning</text><g stroke="#8ab4c4" stroke-width="4" fill="none" stroke-linecap="round"><path d="M300 260h50"/><path d="M570 260h50"/><path d="M840 260h50"/></g><g fill="#8ab4c4"><path d="M343 252l14 8-14 8z"/><path d="M613 252l14 8-14 8z"/><path d="M883 252l14 8-14 8z"/></g><rect x="165" y="415" width="870" height="135" rx="28" fill="#12344d"/><text x="210" y="463" font-size="20" font-weight="700" fill="#fff">Methods across the full chain</text><g font-size="17" font-weight="600"><text x="210" y="505" fill="#9fe1df">AI / Machine Learning</text><text x="455" y="505" fill="#a9d9ed">Remote Sensing</text><text x="650" y="505" fill="#f1d59d">Uncertainty</text><text x="815" y="505" fill="#f4b6a6">Hybrid / Surrogate</text></g><text x="600" y="605" text-anchor="middle" font-size="15" fill="#60717d">Goal: models that are accurate, uncertainty-aware, interpretable and fast enough for practical use.</text></g></svg>