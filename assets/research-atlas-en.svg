<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Overview of research directions</title>
<desc id="desc">Overview of published and emerging research in hydrology, hydraulics, remote sensing, AI, uncertainty, landslides, sediment, hybrid and surrogate modelling.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbfd"/><stop offset=".55" stop-color="#eef8f7"/><stop offset="1" stop-color="#fbf5ec"/></linearGradient>
  <linearGradient id="core" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#12344d"/><stop offset="1" stop-color="#247ba0"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#12344d" flood-opacity=".11"/></filter>
  <style>.t{font-family:Inter,Arial,sans-serif;fill:#12344d}.h{font-weight:800}.s{font-size:18px}.xs{font-size:15px}.mut{fill:#5f7380}.white{fill:#fff}.arr{stroke:#5b8fa5;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b8fa5"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<circle cx="800" cy="430" r="146" fill="url(#core)" filter="url(#shadow)"/>
<circle cx="800" cy="430" r="120" fill="none" stroke="#7bd0d1" stroke-width="2" stroke-dasharray="5 9"/>
<text x="800" y="405" class="white h" font-family="Inter,Arial" font-size="31" text-anchor="middle">WATER SCIENCE</text>
<text x="800" y="446" class="white h" font-family="Inter,Arial" font-size="27" text-anchor="middle">MODELS · DATA · AI</text>
<text x="800" y="483" class="white" font-family="Inter,Arial" font-size="17" text-anchor="middle">Hydrology · Hydraulics · Remote Sensing</text>
<text x="800" y="510" class="white" font-family="Inter,Arial" font-size="17" text-anchor="middle">Uncertainty · Hybrid · Surrogate</text>
<path d="M664 386 C610 356 575 308 548 277" class="arr"/><path d="M800 284 C800 246 800 214 800 180" class="arr"/><path d="M937 386 C998 352 1031 310 1052 274" class="arr"/><path d="M664 474 C604 504 573 548 544 590" class="arr"/><path d="M936 474 C995 508 1030 549 1056 592" class="arr"/><path d="M800 576 C800 612 800 644 800 678" class="arr"/>
<g filter="url(#shadow)"><rect x="70" y="150" width="470" height="205" rx="24" fill="#fff" stroke="#4b8bc5" stroke-width="3"/></g>
<circle cx="118" cy="195" r="25" fill="#e8f2fa"/><text x="118" y="203" text-anchor="middle" class="t h" font-size="22">1</text>
<text x="158" y="192" class="t h" font-size="25">Hydrology &amp; Forecasting</text>
<text x="158" y="223" class="t s">• Streamflow, water-level &amp; flood forecasting</text><text x="158" y="252" class="t s">• LSTM / GRU / DNN / TCN / Seq2Seq</text>
<text x="158" y="281" class="t s">• Rainfall–runoff · event-scale forecasting</text><text x="158" y="310" class="t s">• Reservoir / sluice operation support</text>
<text x="158" y="339" class="t xs mut">Established publication track</text>
<g filter="url(#shadow)"><rect x="560" y="82" width="480" height="168" rx="24" fill="#fff" stroke="#2a9d8f" stroke-width="3"/></g>
<circle cx="604" cy="128" r="24" fill="#e9f7f4"/><text x="604" y="136" text-anchor="middle" class="t h" font-size="22">2</text>
<text x="643" y="126" class="t h" font-size="24">Rainfall &amp; Meteorological Observations</text>
<text x="643" y="157" class="t s">• Satellite precipitation · bias correction</text><text x="643" y="186" class="t s">• Weather radar · radar–gauge merging</text>
<text x="643" y="215" class="t s">• Reconstruction · spatial rainfall uncertainty</text>
<g filter="url(#shadow)"><rect x="1060" y="150" width="470" height="205" rx="24" fill="#fff" stroke="#67c6d4" stroke-width="3"/></g>
<circle cx="1108" cy="195" r="25" fill="#eaf9fb"/><text x="1108" y="203" text-anchor="middle" class="t h" font-size="22">3</text>
<text x="1148" y="192" class="t h" font-size="25">Remote Sensing &amp; Earth Observation</text>
<text x="1148" y="223" class="t s">• Sentinel-1 SAR: flood extent &amp; depth</text><text x="1148" y="252" class="t s">• Optical RS: sediment / water colour</text>
<text x="1148" y="281" class="t s">• Satellite imagery · spatial hazard mapping</text><text x="1148" y="310" class="t s">• Urakami · Valencia: ongoing directions</text>
<text x="1148" y="339" class="t xs mut">Published + ongoing / emerging research</text>
<g filter="url(#shadow)"><rect x="70" y="500" width="470" height="205" rx="24" fill="#fff" stroke="#d97962" stroke-width="3"/></g>
<circle cx="118" cy="545" r="25" fill="#fcece7"/><text x="118" y="553" text-anchor="middle" class="t h" font-size="22">4</text>
<text x="158" y="542" class="t h" font-size="25">Landslides &amp; Geomorphic Hazards</text>
<text x="158" y="573" class="t s">• Landslide susceptibility mapping</text><text x="158" y="602" class="t s">• RF · XGBoost · SVM · ensemble ML</text>
<text x="158" y="631" class="t s">• Feature selection · XAI · uncertainty</text><text x="158" y="660" class="t s">• Two ML/XAI landslide studies (2023–2024)</text>
<text x="158" y="689" class="t xs mut">Disaster prevention + geospatial AI</text>
<g filter="url(#shadow)"><rect x="1060" y="500" width="470" height="205" rx="24" fill="#fff" stroke="#c49a52" stroke-width="3"/></g>
<circle cx="1108" cy="545" r="25" fill="#fff5df"/><text x="1108" y="553" text-anchor="middle" class="t h" font-size="22">5</text>
<text x="1148" y="542" class="t h" font-size="25">Hydraulics · Structures · Sediment</text>
<text x="1148" y="573" class="t s">• Scour depth at sluice outlets / gates</text><text x="1148" y="602" class="t s">• Discharge coefficients: intakes / spillways</text>
<text x="1148" y="631" class="t s">• Physical + numerical + ML modelling</text><text x="1148" y="660" class="t s">• Bedload / sediment transport &amp; hydraulics</text>
<text x="1148" y="689" class="t xs mut">Hydraulics research and collaborations</text>
<g filter="url(#shadow)"><rect x="560" y="674" width="480" height="150" rx="24" fill="#fff" stroke="#8874b5" stroke-width="3"/></g>
<circle cx="604" cy="719" r="24" fill="#f1eef9"/><text x="604" y="727" text-anchor="middle" class="t h" font-size="22">6</text>
<text x="643" y="717" class="t h" font-size="24">AI · Uncertainty · Hybrid · Surrogate</text>
<text x="643" y="748" class="t s">• Explainability · uncertainty quantification</text><text x="643" y="777" class="t s">• Physics + data · hybrid modelling</text>
<text x="643" y="806" class="t s">• Surrogate / reduced-order modelling — emerging</text>
<rect x="85" y="844" width="1430" height="42" rx="21" fill="#12344d"/>
<text x="800" y="872" class="white h" font-family="Inter,Arial" font-size="18" text-anchor="middle">OBSERVATIONS &amp; DATA  →  MODELLING  →  UNCERTAINTY &amp; INTERPRETABILITY  →  PREDICTION / SIMULATION  →  DECISION SUPPORT</text>
</svg>