<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">Research overview</title>
<desc id="desc">Overview of seven connected research themes in water science, models, data and AI.</desc>
<defs>
