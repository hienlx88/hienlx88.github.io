<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">Hybrid Water Intelligence</title><desc id="d">Sơ đồ kết hợp mô hình vật lý, dữ liệu quan trắc và AI trong nghiên cứu nước.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbfc"/><stop offset="1" stop-color="#fff8ef"/></linearGradient></defs><rect width="900" height="620" rx="32" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="60" y="70" font-size="22" font-weight="700" fill="#12344d">HYBRID WATER INTELLIGENCE</text><text x="60" y="102" font-size="16" fill="#60717d">Không phải Physics hay AI — mà là cách hai bên bổ trợ nhau.</text><circle cx="315" cy="295" r="145" fill="#247ba0" fill-opacity=".86"/><circle cx="585" cy="295" r="145" fill="#2a9d8f" fill-opacity=".84"/><circle cx="450" cy="430" r="145" fill="#c49a52" fill-opacity=".78"/><text x="255" y="245" font-size="24" font-weight="700" fill="#fff">PHYSICS</text><text x="230" y="278" font-size="16" fill="#e8f4f9">Governing equations</text><text x="240" y="306" font-size="16" fill="#e8f4f9">Domain constraints</text><text x="540" y="245" font-size="24" font-weight="700" fill="#fff">DATA</text><text x="520" y="278" font-size="16" fill="#ebfbf7">Gauge · Radar</text><text x="505" y="306" font-size="16" fill="#ebfbf7">Satellite · Monitoring</text><text x="410" y="445" font-size="24" font-weight="700" fill="#fff">AI / ML</text><text x="385" y="478" font-size="16" fill="#fff9ee">Pattern learning</text><text x="372" y="506" font-size="16" fill="#fff9ee">Correction · Surrogate</text><circle cx="450" cy="335" r="88" fill="#12344d" stroke="#fff" stroke-width="5"/><text x="450" y="320" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">HYBRID</text><text x="450" y="348" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">MODELLING</text><text x="450" y="378" text-anchor="middle" font-size="13" fill="#cfe7ee">Accuracy · Speed · Insight</text><text x="450" y="580" text-anchor="middle" font-size="15" fill="#60717d">Kết quả tốt hơn không chỉ vì mô hình phức tạp hơn, mà vì thông tin được kết hợp đúng cách.</text></g></svg>