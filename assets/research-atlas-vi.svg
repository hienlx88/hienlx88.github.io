<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Bản đồ tổng thể hướng nghiên cứu của Lê Xuân Hiền</title>
<desc id="desc">Sơ đồ tổng hợp các hướng nghiên cứu đã công bố và đang phát triển trong thủy văn, thủy lực, viễn thám, AI, bất định, landslide, sediment, hybrid và surrogate modelling.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbfd"/><stop offset=".55" stop-color="#eef8f7"/><stop offset="1" stop-color="#fbf5ec"/></linearGradient>
  <linearGradient id="core" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#12344d"/><stop offset="1" stop-color="#247ba0"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#12344d" flood-opacity=".11"/></filter>
  <style>
    .t{font-family:Inter,Arial,sans-serif;fill:#12344d}.h{font-weight:800}.m{font-size:22px}.s{font-size:18px}.xs{font-size:15px}.mut{fill:#5f7380}.white{fill:#fff}.line{stroke:#cfdde4;stroke-width:2}.arr{stroke:#5b8fa5;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b8fa5"/></marker>
</defs>
<rect width="1600" height="920" rx="34" fill="url(#bg)"/>
<text x="74" y="70" class="t h" font-size="38">Bản đồ tổng thể hướng nghiên cứu</text>
<text x="74" y="104" class="t mut" font-size="19">Lê Xuân Hiền · từ quan trắc và dữ liệu → mô hình → bất định → hỗ trợ quyết định</text>

<!-- central core -->
<circle cx="800" cy="438" r="144" fill="url(#core)" filter="url(#shadow)"/>
<circle cx="800" cy="438" r="119" fill="none" stroke="#7bd0d1" stroke-width="2" stroke-dasharray="5 9"/>
<text x="800" y="405" class="white h" font-family="Inter,Arial" font-size="31" text-anchor="middle">KHOA HỌC NƯỚC</text>
<text x="800" y="444" class="white h" font-family="Inter,Arial" font-size="27" text-anchor="middle">MÔ HÌNH · DỮ LIỆU · AI</text>
<text x="800" y="480" class="white" font-family="Inter,Arial" font-size="17" text-anchor="middle">Hydrology · Hydraulics · Remote Sensing</text>
<text x="800" y="508" class="white" font-family="Inter,Arial" font-size="17" text-anchor="middle">Uncertainty · Hybrid · Surrogate</text>

<!-- connectors -->
<path d="M664 394 C610 364 575 316 548 285" class="arr"/>
<path d="M800 294 C800 252 800 220 800 184" class="arr"/>
<path d="M937 394 C998 360 1031 318 1052 282" class="arr"/>
<path d="M664 482 C604 512 573 556 544 598" class="arr"/>
<path d="M936 482 C995 516 1030 557 1056 600" class="arr"/>
<path d="M800 582 C800 618 800 650 800 686" class="arr"/>

<!-- 1 Hydrology -->
<g filter="url(#shadow)"><rect x="70" y="190" width="470" height="205" rx="24" fill="#fff" stroke="#4b8bc5" stroke-width="3"/></g>
<rect x="70" y="190" width="10" height="205" rx="5" fill="#247ba0"/>
<circle cx="118" cy="235" r="25" fill="#e8f2fa"/><text x="118" y="243" text-anchor="middle" class="t h m">1</text>
<text x="158" y="232" class="t h" font-size="25">Thủy văn & dự báo</text>
<text x="158" y="263" class="t s">• Dự báo dòng chảy, mực nước, lũ</text>
<text x="158" y="292" class="t s">• LSTM / GRU / DNN / TCN / Seq2Seq</text>
<text x="158" y="321" class="t s">• Rainfall–runoff · event-scale forecasting</text>
<text x="158" y="350" class="t s">• Reservoir / sluice operation support</text>
<text x="158" y="379" class="t xs mut">Đã công bố nhiều · trục nghiên cứu lâu dài</text>

<!-- 2 Rainfall -->
<g filter="url(#shadow)"><rect x="560" y="126" width="480" height="168" rx="24" fill="#fff" stroke="#2a9d8f" stroke-width="3"/></g>
<rect x="560" y="126" width="480" height="8" rx="4" fill="#2a9d8f"/>
<circle cx="604" cy="172" r="24" fill="#e9f7f4"/><text x="604" y="180" text-anchor="middle" class="t h m">2</text>
<text x="643" y="170" class="t h" font-size="24">Mưa & quan trắc khí tượng</text>
<text x="643" y="201" class="t s">• Mưa vệ tinh · bias correction · reconstruction</text>
<text x="643" y="230" class="t s">• Radar thời tiết · radar–gauge merging</text>
<text x="643" y="259" class="t s">• Spatial consistency · rainfall uncertainty</text>

<!-- 3 EO -->
<g filter="url(#shadow)"><rect x="1060" y="190" width="470" height="205" rx="24" fill="#fff" stroke="#67c6d4" stroke-width="3"/></g>
<rect x="1520" y="190" width="10" height="205" rx="5" fill="#67c6d4"/>
<circle cx="1108" cy="235" r="25" fill="#eaf9fb"/><text x="1108" y="243" text-anchor="middle" class="t h m">3</text>
<text x="1148" y="232" class="t h" font-size="25">Viễn thám & quan sát Trái đất</text>
<text x="1148" y="263" class="t s">• Sentinel-1 SAR: flood extent & depth</text>
<text x="1148" y="292" class="t s">• Optical RS: sediment / water colour</text>
<text x="1148" y="321" class="t s">• Satellite imagery · spatial hazard mapping</text>
<text x="1148" y="350" class="t s">• Urakami · Valencia: hướng đang phát triển</text>
<text x="1148" y="379" class="t xs mut">Published + ongoing / emerging directions</text>

<!-- 4 Landslide -->
<g filter="url(#shadow)"><rect x="70" y="520" width="470" height="205" rx="24" fill="#fff" stroke="#d97962" stroke-width="3"/></g>
<rect x="70" y="520" width="10" height="205" rx="5" fill="#d97962"/>
<circle cx="118" cy="565" r="25" fill="#fcece7"/><text x="118" y="573" text-anchor="middle" class="t h m">4</text>
<text x="158" y="562" class="t h" font-size="25">Landslide & tai biến địa hình</text>
<text x="158" y="593" class="t s">• Landslide susceptibility mapping</text>
<text x="158" y="622" class="t s">• RF · XGBoost · SVM · ensemble ML</text>
<text x="158" y="651" class="t s">• Feature selection · XAI · uncertainty</text>
<text x="158" y="680" class="t s">• Hai bài ML/XAI về landslide (2023–2024)</text>
<text x="158" y="709" class="t xs mut">Disaster prevention + geospatial AI</text>

<!-- 5 Hydraulics -->
<g filter="url(#shadow)"><rect x="1060" y="520" width="470" height="205" rx="24" fill="#fff" stroke="#c49a52" stroke-width="3"/></g>
<rect x="1520" y="520" width="10" height="205" rx="5" fill="#c49a52"/>
<circle cx="1108" cy="565" r="25" fill="#fff5df"/><text x="1108" y="573" text-anchor="middle" class="t h m">5</text>
<text x="1148" y="562" class="t h" font-size="25">Thủy lực · công trình · bùn cát</text>
<text x="1148" y="593" class="t s">• Scour depth tại cửa van / sluice outlets</text>
<text x="1148" y="622" class="t s">• Discharge coefficients: intake / spillway</text>
<text x="1148" y="651" class="t s">• Physical + numerical + ML modelling</text>
<text x="1148" y="680" class="t s">• Bedload / sediment transport & hydraulics</text>
<text x="1148" y="709" class="t xs mut">Nhóm nghiên cứu thủy lực & hợp tác với PGS. Hiền</text>

<!-- 6 AI/hybrid -->
<g filter="url(#shadow)"><rect x="560" y="690" width="480" height="150" rx="24" fill="#fff" stroke="#8874b5" stroke-width="3"/></g>
<rect x="560" y="832" width="480" height="8" rx="4" fill="#8874b5"/>
<circle cx="604" cy="735" r="24" fill="#f1eef9"/><text x="604" y="743" text-anchor="middle" class="t h m">6</text>
<text x="643" y="733" class="t h" font-size="24">AI · bất định · hybrid · surrogate</text>
<text x="643" y="764" class="t s">• Explainability · uncertainty quantification</text>
<text x="643" y="793" class="t s">• Physics + data · hybrid modelling</text>
<text x="643" y="822" class="t s">• Surrogate / reduced-order modelling — hướng mới</text>

<!-- bottom narrative -->
<rect x="85" y="858" width="1430" height="42" rx="21" fill="#12344d"/>
<text x="800" y="886" class="white h" font-family="Inter,Arial" font-size="18" text-anchor="middle">QUAN TRẮC & DỮ LIỆU  →  MÔ HÌNH  →  BẤT ĐỊNH & GIẢI THÍCH  →  DỰ BÁO / MÔ PHỎNG  →  HỖ TRỢ QUYẾT ĐỊNH</text>
</svg>