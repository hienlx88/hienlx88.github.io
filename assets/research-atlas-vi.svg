<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">Tổng quan các hướng nghiên cứu</title>
<desc id="desc">Infographic tổng quan về thủy văn, mưa, ngập lụt, viễn thám, AI hybrid surrogate modelling, thủy lực công trình và landslide machine learning.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset=".55" stop-color="#f7fbff"/><stop offset="1" stop-color="#f2fbfa"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1658d6"/><stop offset=".48" stop-color="#1188db"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#113b91"/><stop offset=".55" stop-color="#1466cc"/><stop offset="1" stop-color="#10b5a6"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1a73e8"/><stop offset="1" stop-color="#4cc9f0"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#163b63" flood-opacity=".12"/></filter>
  <style>
    .t{font-family:Inter,Arial,sans-serif;fill:#153451}.h{font-weight:800}.title{font-size:29px}.body{font-size:20px}.small{font-size:16px}.mut{fill:#5c7180}.white{fill:#fff}.panel{fill:#fff;stroke:#dce7ef;stroke-width:2}.lineB{stroke:#1570d8;stroke-width:4;fill:none}.lineT{stroke:#12a99a;stroke-width:4;fill:none}.dotB{fill:#1570d8;stroke:#fff;stroke-width:4}.dotT{fill:#12a99a;stroke:#fff;stroke-width:4}
  </style>
</defs>
<rect width="1600" height="1060" fill="url(#bg)"/>

